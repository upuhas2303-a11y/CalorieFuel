<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Calorie Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2f2c 0%, #0e1e1c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calorie-card {
            max-width: 580px;
            width: 100%;
            background: rgba(255, 248, 235, 0.97);
            border-radius: 56px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .hero {
            background: linear-gradient(135deg, #ffb347, #ff8c1a);
            padding: 28px 24px;
            text-align: center;
            color: #2c221b;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .hero p {
            margin-top: 8px;
            opacity: 0.85;
            font-weight: 500;
        }

        .content {
            padding: 28px 28px 32px;
        }

        .input-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: #3e2a22;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #fff8f0;
            border-radius: 40px;
            border: 1.5px solid #ffe0bc;
            transition: all 0.2s;
            padding: 4px 18px;
        }

        .input-field:focus-within {
            border-color: #ff8c1a;
            box-shadow: 0 0 0 3px rgba(255, 140, 26, 0.2);
            background: white;
        }

        .input-field input, .input-field select {
            width: 100%;
            padding: 14px 0 14px 8px;
            font-size: 1rem;
            background: transparent;
            border: none;
            outline: none;
            font-weight: 500;
            color: #2c3e2b;
        }

        .input-field select {
            cursor: pointer;
        }

        .double-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .double-row .input-group {
            flex: 1;
            min-width: 130px;
        }

        .calc-btn {
            width: 100%;
            background: #2b5e4c;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            margin: 24px 0 20px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 #1b3e32;
        }

        .calc-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #1b3e32;
        }

        .calc-btn:hover {
            background: #3f7a64;
        }

        .result-panel {
            background: #f3efe7;
            border-radius: 36px;
            padding: 18px 20px;
            margin-top: 12px;
        }

        .total-calories {
            text-align: center;
            margin-bottom: 14px;
        }

        .total-calories .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a57248;
            font-weight: 600;
        }

        .kcal-number {
            font-size: 3.8rem;
            font-weight: 800;
            color: #2e5a47;
            line-height: 1;
            margin: 8px 0;
            letter-spacing: -2px;
        }

        .breakdown {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid #e2d4c6;
            padding-top: 16px;
            margin-top: 8px;
        }

        .breakdown-item {
            flex: 1;
            text-align: center;
            background: white;
            border-radius: 28px;
            padding: 10px 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .breakdown-item span:first-child {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a07854;
            display: block;
        }

        .breakdown-item .value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2c4a3b;
        }

        .info-message {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 18px;
            color: #9b7b5e;
            background: #fff3e6;
            padding: 8px 12px;
            border-radius: 60px;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 14px 20px 20px;
            color: #c2a07e;
            border-top: 1px solid #eedfcb;
            background: #fffbf5;
        }

        @media (max-width: 500px) {
            .content {
                padding: 20px;
            }
            .kcal-number {
                font-size: 2.8rem;
            }
            .breakdown-item .value {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="calorie-card">
    <div class="hero">
        <h1>CalorieFuel</h1>
        <p>Your personal energy balance</p>
    </div>
    <div class="content">
        <div class="double-row">
            <div class="input-group">
                <label>Gender</label>
                <div class="input-field">
                    <select id="gender">
                        <option value="female">Female</option>
                        <option value="male" selected>Male</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Age (years)</label>
                <div class="input-field">
                    <input type="number" id="age" placeholder="25" value="28" step="1" min="15" max="120">
                </div>
            </div>
        </div>

        <div class="double-row">
            <div class="input-group">
                <label>Weight (kg)</label>
                <div class="input-field">
                    <input type="number" id="weight" placeholder="70" value="70" step="0.5" min="20" max="300">
                </div>
            </div>
            <div class="input-group">
                <label>Height (cm)</label>
                <div class="input-field">
                    <input type="number" id="height" placeholder="170" value="170" step="1" min="100" max="250">
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Physical Activity</label>
            <div class="input-field">
                <select id="activity">
                    <option value="1.2">Minimal (sedentary lifestyle)</option>
                    <option value="1.375">Light (1-3 workouts per week)</option>
                    <option value="1.55" selected>Moderate (3-5 workouts)</option>
                    <option value="1.725">High (6-7 workouts)</option>
                    <option value="1.9">Extreme (physical work + sports)</option>
                </select>
            </div>
        </div>

        <button class="calc-btn" id="calculateBtn">
            Calculate Daily Norm
        </button>

        <div id="resultContainer">
            <div class="result-panel">
                <div class="total-calories">
                    <div class="label">YOUR DAILY NORM</div>
                    <div class="kcal-number" id="kcalDisplay">—</div>
                    <div style="font-size: 0.8rem; font-weight: 500;">kcal / day</div>
                </div>
                <div class="breakdown" id="breakdownInfo">
                    <div class="breakdown-item">
                        <span>Basal Metabolic Rate (BMR)</span>
                        <div class="value" id="bmrValue">—</div>
                    </div>
                    <div class="breakdown-item">
                        <span>With Activity (TDEE)</span>
                        <div class="value" id="tdeeValue">—</div>
                    </div>
                </div>
                <div class="info-message" id="adviceMessage">
                    Fill in the data and click "Calculate"
                </div>
            </div>
        </div>
    </div>
    <footer>
        Mifflin-St Jeor Formula | Individual approach to healthy nutrition
    </footer>
</div>

<script>
    (function() {
        const genderSelect = document.getElementById('gender');
        const ageInput = document.getElementById('age');
        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');
        const activitySelect = document.getElementById('activity');
        const calculateBtn = document.getElementById('calculateBtn');

        const kcalDisplay = document.getElementById('kcalDisplay');
        const bmrValueSpan = document.getElementById('bmrValue');
        const tdeeValueSpan = document.getElementById('tdeeValue');
        const adviceMessage = document.getElementById('adviceMessage');

        function showError(text) {
            adviceMessage.innerHTML = text;
            adviceMessage.style.background = "#ffe0db";
            adviceMessage.style.color = "#bc3900";
            setTimeout(() => {
                if (adviceMessage.innerHTML === text) {
                    const currentCal = kcalDisplay.innerText;
                    if (currentCal !== '—' && !isNaN(parseFloat(currentCal))) {
                        adviceMessage.innerHTML = 'Great goal! Stick to the range for balance.';
                        adviceMessage.style.background = "#fff3e6";
                        adviceMessage.style.color = "#9b7b5e";
                    } else {
                        adviceMessage.innerHTML = 'Fill in the data and click "Calculate"';
                        adviceMessage.style.background = "#fff3e6";
                        adviceMessage.style.color = "#9b7b5e";
                    }
                }
            }, 3200);
        }

        function validateInputs() {
            let age = parseFloat(ageInput.value);
            let weight = parseFloat(weightInput.value);
            let height = parseFloat(heightInput.value);

            if (isNaN(age) || age < 15 || age > 120) {
                showError('Age must be between 15 and 120 years');
                return null;
            }
            if (isNaN(weight) || weight < 20 || weight > 300) {
                showError('Weight must be between 20 and 300 kg');
                return null;
            }
            if (isNaN(height) || height < 100 || height > 250) {
                showError('Height must be between 100 and 250 cm');
                return null;
            }
            return { age, weight, height };
        }

        function calculateCalories() {
            adviceMessage.style.background = "#fff3e6";
            adviceMessage.style.color = "#9b7b5e";
            
            const validData = validateInputs();
            if (!validData) {
                kcalDisplay.innerText = '—';
                bmrValueSpan.innerText = '—';
                tdeeValueSpan.innerText = '—';
                return;
            }

            const { age, weight, height } = validData;
            const gender = genderSelect.value;
            const activityFactor = parseFloat(activitySelect.value);

            let bmr;
            if (gender === 'male') {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }

            bmr = Math.round(bmr);
            let tdee = Math.round(bmr * activityFactor);

            const formatNumber = (num) => num.toLocaleString('en-US');

            kcalDisplay.innerText = formatNumber(tdee);
            bmrValueSpan.innerText = formatNumber(bmr) + ' kcal';
            tdeeValueSpan.innerText = formatNumber(tdee) + ' kcal';

            const forWeightLoss = Math.round(tdee - 300);
            const forWeightGain = Math.round(tdee + 300);
            
            let customAdvice = '';
            
            if (weight < 60 && gender === 'female' && height < 165) {
                customAdvice = 'Your metabolism is active. For quality muscle gain, add 200-300 kcal.';
            } else if (weight > 90) {
                customAdvice = 'To gently lose weight, try to stick to ~' + forWeightLoss + ' kcal.';
            } else if (weight > 75 && gender === 'male') {
                customAdvice = 'For fat burning, ' + forWeightLoss + ' – ' + tdee + ' kcal is recommended, maintaining protein.';
            } else {
                customAdvice = 'Maintenance: ' + tdee + ' kcal. For weight loss ≈' + forWeightLoss + ' kcal, for weight gain ≈' + forWeightGain + ' kcal.';
            }

            if (activityFactor >= 1.725) {
                customAdvice += ' You have high activity - do not forget to replenish energy with carbohydrates.';
            } else if (activityFactor <= 1.2) {
                customAdvice += ' With a sedentary lifestyle, try to increase NEAT activity (walks).';
            }

            adviceMessage.innerHTML = customAdvice;
        }

        function tryAutoCalculate() {
            const validData = validateInputs();
            if (!validData) {
                if(kcalDisplay.innerText !== '—') {
                    kcalDisplay.innerText = '—';
                    bmrValueSpan.innerText = '—';
                    tdeeValueSpan.innerText = '—';
                    adviceMessage.innerHTML = 'Fix values (age, weight or height)';
                    adviceMessage.style.background = "#ffe0db";
                }
                return;
            }
            calculateCalories();
        }

        const inputsList = [genderSelect, ageInput, weightInput, heightInput, activitySelect];
        inputsList.forEach(input => {
            input.addEventListener('change', () => {
                tryAutoCalculate();
            });
            if(input.tagName === 'INPUT') {
                input.addEventListener('input', () => {
                    tryAutoCalculate();
                });
            }
        });

        calculateBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const valid = validateInputs();
            if(!valid) {
                kcalDisplay.innerText = '—';
                bmrValueSpan.innerText = '—';
                tdeeValueSpan.innerText = '—';
                return;
            }
            calculateCalories();
            calculateBtn.style.transform = 'scale(0.98)';
            setTimeout(() => { calculateBtn.style.transform = ''; }, 120);
        });

        setTimeout(() => {
            tryAutoCalculate();
        }, 10);
    })();
</script>
</body>
</html>
